<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Treino de Playwright</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="email"], select, input[type="date"] {
      width: 100%; padding: 8px; box-sizing: border-box;
    }
    .hidden { display: none; color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Formulário de Treino</h2>

  <form id="practice-form" onsubmit="event.preventDefault(); document.getElementById('success-message').classList.remove('hidden');">
    
    <div class="field">
      <label for="username">Nome de Usuário</label>
      <input type="text" id="username" name="username" data-testid="input-username" required>
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" data-testid="input-email" required>
    </div>

    <div class="field">
      <label for="role">Cargo</label>
      <select id="role" name="role" data-testid="select-role">
        <option value="">Selecione...</option>
        <option value="dev">Desenvolvedor</option>
        <option value="qa">Analista de QA</option>
        <option value="pm">Gerente de Projeto</option>
      </select>
    </div>

    <div class="field">
      <label>Nível de Experiência</label>
      <label><input type="radio" name="level" value="junior" data-testid="radio-junior"> Júnior</label>
      <label><input type="radio" name="level" value="pleno" data-testid="radio-pleno"> Pleno</label>
      <label><input type="radio" name="level" value="senior" data-testid="radio-senior"> Sênior</label>
    </div>

    <div class="field">
      <label for="start-date">Data de Início</label>
      <input type="date" id="start-date" name="startDate" data-testid="input-date">
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="terms" name="terms" data-testid="checkbox-terms" required>
        Aceito os termos e condições
      </label>
    </div>

    <button type="submit" id="submit-btn" data-testid="btn-submit">Enviar Cadastro</button>
  </form>

  <p id="success-message" class="hidden" data-testid="msg-success">Cadastro realizado com sucesso!</p>

</body>
</html>
